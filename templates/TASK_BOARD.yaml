# Shared/legacy multi-policy Task Board template.
# DO NOT use this template for execution_policy: chatgpt_only.
# The migrated ChatGPT-only route uses workflow/chatgpt_only/TASK_BOARD_TEMPLATE.yaml.
#
project: "<project>"
plan_revision: "<R#>"
current_milestone: "M01"

# Sole authoritative mutable execution-state record.
# PROJECT.md is high-level only. The approved Master Plan milestone section is the
# default milestone contract; an implementation/milestones/MXX.md file is optional.

# Default is serial. Use bounded_parallel only when cards have explicit safe ownership.
execution_mode: serial # serial | bounded_parallel
parallel_card_limit: 1

# Optional. Use only when Codex strategic requests are configured to reach a ChatGPT control chat.
chatgpt_control_chat:
  name: null
  purpose: "strategic Codex decisions only"

execution_ref:
  branch: null
  pr: null
  head: null

milestones:
  M01:
    decision_state: accepted
    execution_status: planned
    # Default to the approved Master Plan subsection. Point to a separate milestone
    # file only when that JIT contract materially extends the plan.
    contract: planning/MASTER_PLAN.md#M01
    checkpoint: null
    implementation_head: null
    handoff: null
    acceptance_evidence: null
    # Populate only while an independent milestone review gate is active.
    review_state: null # pending | in_progress | green | red
    review_subject: null
    review_evidence: null

cards:
  - id: M01-T01
    title: "<title>"
    milestone: M01
    decision_state: accepted
    execution_status: planned
    executor: null
    depends_on: []
    openspec_change: null
    # Stable authority/scope/acceptance details live in the card contract.
    contract: implementation/cards/M01-T01.md
    # Optional bounded-parallel metadata mirrored here because it affects live scheduling/recovery.
    parallel_safe: false
    write_scope: []
    exclusive_resources: []
    lane_branch: null
    lane_base: null
    # Populate only while an independent card review gate is active.
    review_state: null # pending | in_progress | green | red
    review_subject: null
    review_evidence: null
    result_commit: null
    result_pr: null
    # A simple reproducible card may use tests_summary with evidence: null.
    # Standalone evidence is expected for milestone acceptance, required/recommended
    # independent review, baseline exceptions, material external writes/readback,
    # complex multi-stage verification, or an explicit contract requirement.
    evidence: null
    tests_summary: null
