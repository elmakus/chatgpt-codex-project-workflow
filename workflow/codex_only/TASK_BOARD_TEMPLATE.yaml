# Historical Codex-only root/default Task Board shape.
# Recovery/migration compatibility only: do NOT scaffold this template for new or continued managed work.
# Active Codex-only managed execution uses the exact manifest-bound WORKSTREAM_TASK_BOARD_TEMPLATE.yaml.
# Existing root/default boards remain readable migration/history input and are not mutated as an active state context.
# M02 review/provenance and M03 bounded-parallel history stay readable; never add runtime worker/session identity.

project: "<owner/repository>"
plan_revision: "<R#>"
current_milestone: "M01"

execution_ref:
  branch: null
  pr: null
  head: null

research_obligation: null

# null means ordinary serial execution; see commented batch shape below.
parallel: null

milestones:
  M01:
    decision_state: accepted
    execution_status: planned
    contract: "planning/MASTER_PLAN.md#M01"
    checkpoint: null
    implementation_head: null
    handoff: null
    acceptance_evidence: null
    implementation_owner_role: null # executor when a reviewable milestone/checkpoint subject is frozen
    review:
      requirement: none # REQUIRED | RECOMMENDED | none
      current_attempt: null
      attempts: []

cards:
  - id: "M01-T01"
    title: "<title>"
    milestone: "M01"
    decision_state: accepted
    execution_status: planned
    implementation_owner_role: null # executor when production implementation starts
    depends_on: []
    openspec_change: null
    contract: "implementation/cards/M01-T01.md"
    review:
      requirement: none # MUST match the stable Card review contract
      current_attempt: null
      attempts: []
    result_commit: null
    result_pr: null
    evidence: null
    tests_summary: null

# Review attempt shape when activated:
#
# review:
#   requirement: RECOMMENDED
#   current_attempt: R01
#   attempts:
#     - id: R01
#       state: pending # pending | in_progress | green | red
#       subject: "<exact-immutable-subject>"
#       reviewer_role: tester
#       evidence: null
#
# Append new attempts for changed subjects. Never overwrite prior RED/GREEN attempts.
# Concrete worker/session/model/profile/invocation/resume/replacement identity is forbidden here.

# Parallel batch shape when JIT freezes two or more compatible READY Cards:
#
# parallel:
#   current_batch: B01
#   batches:
#     - id: B01
#       state: prepared # prepared | running | integrating | complete | blocked
#       integration_base: "<exact-git-commit>"
#       evidence: null # required when batch state is blocked/reconciled
#       members:
#         - card_id: M01-T01
#           lane: L01
#           state: prepared # prepared | in_progress | returned | integrated | blocked
#           result_commit: null
#           integrated_commit: null
#           evidence: null
#
# Batch membership/order/base are frozen after launch; completed and reconciled blocked entries remain durable.
# integrated_commit is immutable original batch-integration provenance; a later post-batch review repair advances Card review/result state without overwriting it.
# After current_batch clears from a complete or terminally reconciled blocked batch, integrated reviewable Cards may remain in_progress only as one post-batch review drain; drain review/finalization/correction precedes unrelated new implementation.
# A pre-launch abandoned prepared batch is kept as blocked history with evidence; its Cards are restored to READY before current_batch is cleared.
# Lane labels are semantic project provenance, never concrete worker/session/worktree identity.
# Stable Card contracts, not this mutable board, own parallel_safe/write_scope/exclusive_resources.
