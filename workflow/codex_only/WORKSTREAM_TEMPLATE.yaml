# Codex-only branch-isolated workstream manifest template.
# Routing/workstream-lifecycle metadata only.
# Card/milestone execution/review state belongs only to the selected Task Board.

id: "<stable-workstream-id>"
kind: "issue" # issue | feature | change | maintenance
status: "discovery" # discovery | definition | planning | ready | in_progress | review | blocked | done | superseded

# Stable source-workstream identity/provenance. Keep this value after final integration even if the source branch is later deleted.
branch: "<exact-workstream-branch>"
base_ref: "<exact-ref-used-to-create-workstream>"
integration_target: "<target-branch>"

parent_workstream: null
parent_branch: null
# Required for stacked work: concise durable statement of the parent-only dependency.
# Must be null for an independent workstream.
parent_dependency: null

# Intake is routing/workstream-lifecycle metadata only.
# The pointed record owns intake scope/findings/classification; Card state stays in Task Board.
intake:
  state: null # active | complete | null
  record: null # implementation/workstreams/<id>/INTAKE.md | null

# Pre-execution routing locators only.
# Non-null values are exact repository-relative paths on this workstream branch.
# The pointed artifact owns its own lifecycle/status; this block never mirrors that state.
routing:
  exploratory_scope: null # exact exploratory/brainstorming record | null
  research_obligation: null # exact pre-execution Research record | null
  plan_review: null # exact planning/reviews/<plan-revision>.md record | null

# Workstream-local opaque runtime-policy selection used only for Codex orchestration recovery.
# Null fields are legal only during initial manifest materialization before binding establishment.
orchestration:
  runtime_owner: null
  policy_ref: null
  contract_fingerprint: null

task_board: null # implementation/workstreams/<id>/TASK_BOARD.yaml | null

authority:
  requirements: null
  decisions: []
  plan: null

# Workstream-level final-integration review only.
# Never mirror Card/milestone review state from the Task Board here.
review:
  requirement: null # REQUIRED | RECOMMENDED | none | null
  state: null # pending | in_progress | green | red | null
  subject: null
  evidence: null
  # Optional proof that an already-independent exact Card/milestone review covers this distinct final-integration gate.
  covered_by: null

pr: null
# Exact final integration result when status becomes done; terminal target-side recovery may use this after source-branch deletion.
result: null
